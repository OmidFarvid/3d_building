<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Building</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid h-100">
    <div class="row h-100">
      <div class="col-9 position-relative p-0" id="viewport">
        <h1 class="page-title">Hello JJK</h1>
        <canvas id="canvas"></canvas>
      </div>

      <div class="col-3 controls-panel">
        <h4>Material</h4>
        <select id="materialSelect" class="form-select mb-3">
          <option value="brick">Brick</option>
          <option value="concrete">Concrete</option>
          <option value="wood">Wood</option>
          <option value="glass">Glass</option>
          <option value="metal">Metal</option>
        </select>
        <button id="createButton" class="btn btn-primary w-100 mb-4">Create</button>

        <h4>Move <small>(1 cm)</small></h4>
        <div class="button-grid">
          <button data-action="move-x-minus">X −</button>
          <button data-action="move-x-plus">X +</button>
          <button data-action="move-y-minus">Y −</button>
          <button data-action="move-y-plus">Y +</button>
          <button data-action="move-z-minus">Z −</button>
          <button data-action="move-z-plus">Z +</button>
        </div>

        <h4>Rotate <small>(90°)</small></h4>
        <div class="button-grid">
          <button data-action="rotate-x-minus">RX −</button>
          <button data-action="rotate-x-plus">RX +</button>
          <button data-action="rotate-y-minus">RY −</button>
          <button data-action="rotate-y-plus">RY +</button>
          <button data-action="rotate-z-minus">RZ −</button>
          <button data-action="rotate-z-plus">RZ +</button>
        </div>

        <h4>Library</h4>
        <div id="library" class="library-list"></div>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
